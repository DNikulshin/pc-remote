name: Build Windows Agent Installer

on:
  push:
    branches: [main]
    paths:
      - 'apps/agent/**'
      - 'packages/shared/**'
      - '.github/workflows/build-agent.yml'
      - 'installer/**'
    # Тег v* собирает установщик и прикрепляет его к GitHub Release
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Прикрепить установщик к существующему релизу (например v1.0.0)'
        required: false

permissions:
  contents: write

jobs:
  test:
    name: Test agent
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared
        run: pnpm --filter @pc-remote/shared build

      - name: Run agent tests
        run: pnpm --filter agent test

  build:
    name: Build Windows Agent Installer
    needs: test
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared
        run: pnpm --filter @pc-remote/shared build

      - name: Bundle agent with esbuild
        run: pnpm --filter agent bundle

      - name: Package agent with pkg
        run: pnpm --filter agent package:win

      - name: Download WinSW
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path installer/winsw
          Invoke-WebRequest `
            -Uri "https://github.com/winsw/winsw/releases/download/v2.12.0/WinSW-x64.exe" `
            -OutFile "installer/winsw/winsw.exe"

      - name: Build installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: installer/installer.iss
          options: /O+

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: pc-remote-agent-setup
          path: installer/output/pc-remote-agent-setup.exe
          retention-days: 30

      - name: Upload standalone agent exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: pc-remote-agent-exe
          path: apps/agent/dist-win/agent.exe
          retention-days: 30

      # Для тега или ручного запуска с release_tag — кладём установщик в релиз.
      # Создаём релиз, если его ещё нет (APK-джоба может завершиться позже).
      - name: Attach installer to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_tag }}
        shell: bash
        run: |
          set -e
          SETUP="pc-remote-agent-${RELEASE_TAG}-setup.exe"
          AGENT="pc-remote-agent-${RELEASE_TAG}.exe"
          cp installer/output/pc-remote-agent-setup.exe "$SETUP"
          cp apps/agent/dist-win/agent.exe "$AGENT"
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$SETUP" "$AGENT" --clobber
          else
            gh release create "$RELEASE_TAG" "$SETUP" "$AGENT" \
              --title "PC Remote $RELEASE_TAG" \
              --generate-notes
          fi
